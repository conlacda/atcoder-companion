name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: playwright-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted]
    timeout-minutes: 60

    env:
      PLAYWRIGHT_CDP_URL: http://127.0.0.1:9222
      PLAYWRIGHT_EXTENSION_ID: ${{ vars.PLAYWRIGHT_EXTENSION_ID }}

    defaults:
      run:
        working-directory: ./browser-extension/chrome-extension-test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: browser-extension/chrome-extension-test/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Chrome debugging connection
        run: curl --fail --silent --show-error --max-time 5 "$PLAYWRIGHT_CDP_URL/json/version"

      - name: Run Playwright tests
        run: npm run test:cdp

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: browser-extension/chrome-extension-test/playwright-report/
          retention-days: 30
